server {
    listen 80;
    server_name box4realestate.cloud www.box4realestate.cloud 72.60.215.216 localhost;

    client_max_body_size 50M;

    # Static files
    location /static/ {
        alias /app/static/;
    }

    # Media files (e.g. user profile photos)
    location /media/ {
        alias /app/media/;
    }

    # Proxy all traffic to the Gunicorn WSGI server
    location / {
        proxy_pass http://web:8000;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }
}

