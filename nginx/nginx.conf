upstream django_app {
    server web:8000;
}

server {
    listen 80;
    server_name localhost; # Change this to your domain or VPS public IP when deploying

    client_max_body_size 50M;

    # Static files
    location /static/ {
        alias /app/static/;
    }

    # Media files (e.g. user profile photos)
    location /media/ {
        alias /app/media/;
    }

    # Proxy all traffic to the Gunicorn WSGI server
    location / {
        proxy_pass http://django_app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }
}
