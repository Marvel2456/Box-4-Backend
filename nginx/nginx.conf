server {
    listen 80;
    server_name box4realestate.cloud www.box4realestate.cloud 72.60.215.216 localhost;

    client_max_body_size 50M;

    # Serve static & media on HTTP fallback if SSL not present
    location /static/ {
        alias /app/static/;
    }

    location /media/ {
        alias /app/media/;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_redirect off;
    }
}

server {
    listen 443 ssl;
    server_name box4realestate.cloud www.box4realestate.cloud;

    ssl_certificate /etc/letsencrypt/live/box4realestate.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/box4realestate.cloud/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 50M;

    # Static files
    location /static/ {
        alias /app/static/;
    }

    # Media files
    location /media/ {
        alias /app/media/;
    }

    # Proxy all traffic to the Gunicorn WSGI server
    location / {
        proxy_pass http://web:8000;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_redirect off;
    }
}


